name: Build APK and plugin

# Builds an installable APK plus the Null Commander FX plugin. No secrets are needed:
# the APK is signed with the fixed debug key in app/debug.keystore.
# Download the results from the run page under "Artifacts".

on:
  push:
    branches: [main, ci-and-custom-plugins]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-test:
    name: Plugin host test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build plugin and CLAP host, run audio through them
        run: tests/clap-host/run.sh

  app:
    name: MicUp APK
    needs: plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Pack the freshly built plugin into the APK so it is installed on first launch.
      - uses: actions/download-artifact@v4
        with:
          pattern: NullCommander-*
          path: plugin-artifacts
      - name: Put plugin into app assets
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p app/src/main/assets/plugins/$abi
            cp plugin-artifacts/NullCommander-$abi/NullCommander.clap app/src/main/assets/plugins/$abi/
          done
          find app/src/main/assets -type f -exec ls -la {} \;

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: ''   # the default installs a legacy "tools" package that no longer exists

      - name: Install NDK and CMake
        run: |
          echo "y" | sdkmanager "ndk;26.3.11579264" --sdk_root=$ANDROID_SDK_ROOT
          echo "y" | sdkmanager "cmake;3.22.1" --sdk_root=$ANDROID_SDK_ROOT

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Cache CMake downloads
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            ~/.cmake
          key: ${{ runner.os }}-cmake-${{ hashFiles('app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-cmake-

      - name: Build debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MicUp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 7

  plugin:
    name: Null Commander FX (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake -S plugins/null-commander -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ls -la build/NullCommander.clap
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NullCommander-${{ matrix.abi }}
          path: build/NullCommander.clap
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [host-test, app, plugin]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="1.1.${{ github.run_number }}"
          mkdir -p files
          cp out/MicUp-debug-apk/*.apk "files/MicUp-$VER.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp out/NullCommander-$abi/NullCommander.clap "files/NullCommander-$abi.clap"
          done
          gh release create "v$VER" files/* \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "MicUp $VER" \
            --notes "Build $VER from commit ${{ github.sha }}. Install MicUp-$VER.apk. Null Commander FX is already inside the app; the NullCommander-*.clap files are only for manual import."
